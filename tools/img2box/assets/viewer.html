<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>天空盒预览器</title>
<style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #111; }
    canvas { display: block; }
    #info {
        position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
        color: #fff; font-family: "Microsoft YaHei", sans-serif; font-size: 13px;
        background: rgba(0,0,0,0.55); padding: 8px 18px; border-radius: 20px;
        pointer-events: none; z-index: 10; white-space: nowrap;
        letter-spacing: 0.5px;
    }
    /* 底部模型控制条:明显但不遮挡天空盒(半透明 + 小尺寸) */
    #ui-bar {
        position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
        display: flex; align-items: center; gap: 8px;
        background: rgba(0,0,0,0.6); padding: 7px 14px; border-radius: 24px;
        z-index: 10; backdrop-filter: blur(4px);
        font-family: "Microsoft YaHei", sans-serif;
    }
    #ui-bar label {
        color: #cfcfcf; font-size: 12px; white-space: nowrap;
    }
    #ui-bar select, #ui-bar button {
        background: rgba(255,255,255,0.14);
        color: #fff; border: 1px solid rgba(255,255,255,0.3);
        border-radius: 16px; padding: 5px 12px; font-size: 12px;
        font-family: "Microsoft YaHei", sans-serif; cursor: pointer;
        max-width: 150px; outline: none;
    }
    #ui-bar select:hover, #ui-bar button:hover { background: rgba(255,255,255,0.24); }
    #ui-bar select option { background: #222; color: #fff; }
    /* 显隐开关:显示中 = 高亮(琥珀),隐藏 = 灰 */
    #toggle-models { transition: background 0.15s; }
    #toggle-models.on { background: rgba(217,119,87,0.95); border-color: #d97757; color: #fff; font-weight: 600; }
</style>
</head>
<body>
<div id="info">🖱 拖拽旋转视角 · 滚轮缩放 · 下方可切换模型</div>

<div id="ui-bar">
    <label>地面</label>
    <select id="ground-select"><option value="">无</option></select>
    <label>展示</label>
    <select id="display-select"><option value="">无</option></select>
    <button id="toggle-models">显示模型</button>
</div>

<script src="./vendor/three.min.js"></script>
<script src="./vendor/OrbitControls.js"></script>
<script src="./vendor/GLTFLoader.js"></script>

<script>
// ── 配置：贴图目录（面图与 viewer.html 同目录） ──
const TEX_DIR = ''; // 面图与 viewer.html 同目录(由后端服务指定目录)
// 材质顺序：BoxGeometry 为 +X,-X,+Y,-Y,+Z,-Z
const FACE_FILES = ['right.png', 'left.png', 'top.png', 'bottom.png', 'front.png', 'back.png'];

// ── 场景 ──
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// ── 天空盒 ──
const loader = new THREE.TextureLoader();
const materials = FACE_FILES.map(file => {
    return new THREE.MeshBasicMaterial({
        map: loader.load(TEX_DIR + file),
        side: THREE.BackSide,   // 从内部看
        depthWrite: false,
    });
});
const skyGeo = new THREE.BoxGeometry(500, 500, 500);
const skybox = new THREE.Mesh(skyGeo, materials);
scene.add(skybox);

// ── 轨道控制器（相机在天空盒内、模型上方,看向中心） ──
const controls = new THREE.OrbitControls(camera, renderer.domElement);
camera.position.set(0, 90, 170);         // 远离中心模型,能看到地面+展示模型
controls.target.set(0, 20, 0);            // 看向模型区域
controls.enableZoom = true;
controls.zoomSpeed = 0.8;
controls.rotateSpeed = 0.9;
controls.enableDamping = true;           // 惯性
controls.dampingFactor = 0.08;
controls.minDistance = 30;               // 防止穿进模型
controls.maxDistance = 230;              // 仍在天空盒(500)内

// ── 灯光:模型多为 PBR 材质(受光),无灯会全黑 ──
scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(120, 200, 100);
scene.add(dirLight);

// ── 加载状态 ──
let loaded = 0;
materials.forEach((m, i) => {
    loader.load(TEX_DIR + FACE_FILES[i], tex => {
        m.map = tex;
        m.needsUpdate = true;
        loaded++;
        if (loaded === 6) {
            document.getElementById('info').textContent = '✅ 天空盒已加载 · 拖拽旋转查看 · 下方切换模型';
        }
    }, undefined, () => {
        document.getElementById('info').textContent = `⚠ 加载失败: ${FACE_FILES[i]}（请确认面图目录正确）`;
    });
});

// ── 地面/展示模型（放在天空盒中心 0,0,0,等比例归一化尺寸） ──
const gltfLoader = new THREE.GLTFLoader();
let groundObj = null;
let displayObj = null;
let modelsVisible = false;   // 默认隐藏模型(用户可点"显示模型"查看)
const GROUND_TARGET = 80;   // 地面模型最大边目标尺寸(天空盒 500 的 16%)
const DISPLAY_TARGET = 50;  // 展示模型最大边目标尺寸(10%)
const GROUND_DEFAULT = '木板';   // 默认地面模型(按名称匹配)
const DISPLAY_DEFAULT = '宝箱';  // 默认展示模型

// 等比例缩放 + 贴地对齐,用户模型尺寸/原点不可控,统一归一化
// alignBottom=true(展示模型,原点在底面)→ 底部贴地 y=0;
// alignBottom=false(地面模型,原点在顶面)→ 顶面贴地 y=0,模型向下铺,与展示模型无缝衔接
function normalizeModel(obj, target, alignBottom) {
    const box = new THREE.Box3().setFromObject(obj);
    const size = box.getSize(new THREE.Vector3());
    const max = Math.max(size.x, size.y, size.z) || 1;
    const s = target / max;
    obj.scale.set(s, s, s);
    obj.updateMatrixWorld(true);
    const box2 = new THREE.Box3().setFromObject(obj);
    obj.position.y -= alignBottom ? box2.min.y : box2.max.y;
}

function clearModel(type) {
    if (type === 'ground' && groundObj) { scene.remove(groundObj); groundObj = null; }
    if (type === 'display' && displayObj) { scene.remove(displayObj); displayObj = null; }
}

function loadModel(type, file) {
    clearModel(type);
    if (!file) return;
    gltfLoader.load(`/models/${type}/${encodeURIComponent(file)}`, (gltf) => {
        const obj = gltf.scene;
        normalizeModel(obj, type === 'ground' ? GROUND_TARGET : DISPLAY_TARGET, type === 'display');
        obj.position.x = 0;
        obj.position.z = 0;
        obj.visible = modelsVisible;
        scene.add(obj);
        if (type === 'ground') groundObj = obj; else displayObj = obj;
    }, undefined, (err) => {
        document.getElementById('info').textContent = `⚠ 模型加载失败: ${file}`;
        console.error(err);
    });
}

// 模型列表(/models.json 由后端提供) → 填充下拉,默认选中指定模型(defaultName 按去掉扩展名的名称匹配)
function fillSelect(sel, files, defaultName) {
    sel.innerHTML = '<option value="">无</option>';
    files.forEach(f => {
        const opt = document.createElement('option');
        opt.value = f;
        opt.textContent = f.replace(/\.(glb|gltf|obj)$/i, '');
        sel.appendChild(opt);
    });
    let pick = null;
    if (defaultName) {
        pick = files.find(f => f.replace(/\.(glb|gltf|obj)$/i, '') === defaultName) || files[0] || '';
    } else {
        pick = files[0] || '';
    }
    if (pick) {
        sel.value = pick;
        sel.dispatchEvent(new Event('change'));
    }
}

fetch('/models.json').then(r => r.json()).then(data => {
    fillSelect(document.getElementById('ground-select'), data.ground || [], GROUND_DEFAULT);
    fillSelect(document.getElementById('display-select'), data.display || [], DISPLAY_DEFAULT);
}).catch(() => {});

document.getElementById('ground-select').addEventListener('change', (e) => loadModel('ground', e.target.value));
document.getElementById('display-select').addEventListener('change', (e) => loadModel('display', e.target.value));

const toggleBtn = document.getElementById('toggle-models');
toggleBtn.addEventListener('click', () => {
    modelsVisible = !modelsVisible;
    [groundObj, displayObj].forEach(o => { if (o) o.visible = modelsVisible; });
    toggleBtn.textContent = modelsVisible ? '隐藏模型' : '显示模型';
    toggleBtn.classList.toggle('on', modelsVisible);
});

// ── 动画循环 ──
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();

// ── 窗口自适应 ──
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
